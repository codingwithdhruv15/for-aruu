<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff9e80">
  <title>For Her 💌</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600;1,700&family=Nunito:wght@600;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="page-3.css">
</head>
<body class="p3">
  <div class="rays" aria-hidden="true"></div>
  <div class="floaters" aria-hidden="true"></div>

  <main class="stage">
    <h1 class="title" id="title"></h1>
    <p class="sub" id="sub"></p>

    <div class="big-teddy bobber">
      <div class="teddy"><svg class="teddy-svg" viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<ellipse cx="62" cy="230" rx="27" ry="17" fill="#b9773f"/>
<ellipse cx="138" cy="230" rx="27" ry="17" fill="#b9773f"/>
<ellipse cx="62" cy="232" rx="14" ry="9" fill="#f6d6b5"/>
<ellipse cx="138" cy="232" rx="14" ry="9" fill="#f6d6b5"/>
<ellipse cx="100" cy="188" rx="60" ry="52" fill="#c98a4b"/>
<ellipse cx="100" cy="194" rx="37" ry="37" fill="#f6d6b5"/>
<ellipse cx="44" cy="172" rx="16" ry="33" fill="#b9773f" transform="rotate(28 44 172)"/>
<ellipse cx="156" cy="172" rx="16" ry="33" fill="#b9773f" transform="rotate(-28 156 172)"/>
<g class="t-head">
<circle cx="52" cy="48" r="27" fill="#b9773f"/><circle cx="52" cy="48" r="15" fill="#f6b8b0"/>
<circle cx="148" cy="48" r="27" fill="#b9773f"/><circle cx="148" cy="48" r="15" fill="#f6b8b0"/>
<circle cx="100" cy="88" r="58" fill="#c98a4b"/>
<ellipse cx="100" cy="108" rx="28" ry="21" fill="#f6d6b5"/>
<circle class="t-eye" cx="77" cy="82" r="6" fill="#3a2114"/><circle class="t-eye" cx="123" cy="82" r="6" fill="#3a2114"/>
<circle cx="79" cy="80" r="2" fill="#fff"/><circle cx="125" cy="80" r="2" fill="#fff"/>
<circle cx="64" cy="102" r="9" fill="#ff8fa3" opacity=".55"/><circle cx="136" cy="102" r="9" fill="#ff8fa3" opacity=".55"/>
<ellipse cx="100" cy="99" rx="9" ry="6.5" fill="#3a2114"/>
<path d="M100 105 V111 M100 111 Q92 121 83 113 M100 111 Q108 121 117 113" stroke="#3a2114" stroke-width="3" fill="none" stroke-linecap="round"/>
</g>
<path d="M100 148 L74 134 Q68 148 74 162 Z" fill="#ff5c8a"/>
<path d="M100 148 L126 134 Q132 148 126 162 Z" fill="#ff5c8a"/>
<circle cx="100" cy="148" r="7" fill="#e0345f"/>
</svg></div>
      <button class="belly-btn" id="bellyBtn" aria-label="Tap"><span>💛</span></button>
    </div>

    <p class="hint" id="hint"></p>
  </main>

  <!-- LETTER -->
  <div class="overlay" id="overlay">
    <div class="scene" id="scene">
      <div class="envelope">
        <div class="env-back"></div>
        <div class="env-flap"></div>
        <div class="env-front"></div>
        <div class="env-seal">💌</div>
      </div>

      <div class="letter">
        <div class="paper">
          <div class="l-to" id="lTo"></div>
          <p class="l-text" id="lText"></p>
          <div class="l-from" id="lFrom"></div>
        </div>
        <div class="slot hidden" id="nextSlot">
          <button class="btn btn-gold" id="nextBtn"><span class="shine"></span><span id="nextLabel"></span></button>
        </div>
      </div>
    </div>
  </div>

  <script src="page-3.js"></script>
</body>
</html>
